apiVersion: v1
kind: PersistentVolume
metadata:
  name: repo-pv
spec:
  storageClassName: manual
  capacity:
    storage: 500Mi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: __PROJECT_DIR__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repo-pvc
spec:
  storageClassName: manual
  volumeName: repo-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: auth-pv
spec:
  storageClassName: manual
  capacity:
    storage: 500Mi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: /mnt/project1/auth-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-pvc
spec:
  storageClassName: manual
  volumeName: auth-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  storageClassName: manual
  capacity:
    storage: 500Mi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: /mnt/project1/mongo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  storageClassName: manual
  volumeName: mongo-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
